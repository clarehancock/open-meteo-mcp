<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wired — talk to your server (free / Gemini)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1115;
    --panel: #16191f;
    --panel-2: #1c2028;
    --line: #262b35;
    --ink: #e8eaed;
    --ink-dim: #9aa1ad;
    --ink-faint: #565d6a;
    --live: #5ee6a8;
    --live-dim: #234f3d;
    --wire: #4c8bf5;
    --wire-dim: #1b2d4d;
    --error: #e8746b;
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  body {
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    height: 100vh;
    padding: 20px;
  }

  header { flex-shrink: 0; margin-bottom: 14px; }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 450;
    font-size: 24px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  h1 span { color: var(--wire); font-style: italic; font-weight: 300; }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    text-align: right;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink-faint);
    flex-shrink: 0;
  }

  .status.live .dot {
    background: var(--live);
    box-shadow: 0 0 0 3px var(--live-dim);
  }

  .field-row { display: flex; gap: 8px; margin-bottom: 8px; }

  .field-row input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 13px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    outline: none;
    min-width: 0;
  }

  .field-row input::placeholder { color: var(--ink-faint); }
  .field-row input:focus { border-color: var(--wire); }
  .field-row input:focus-visible { outline: 2px solid var(--wire); outline-offset: 1px; }

  .field-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    width: 62px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  .connect-btn {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 0 18px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    margin-top: 4px;
    align-self: flex-end;
  }

  .connect-btn:hover { border-color: var(--wire); color: var(--wire); }
  .connect-btn:focus-visible { outline: 2px solid var(--wire); outline-offset: 1px; }

  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 6px;
    line-height: 1.5;
  }
  .hint.error { color: var(--error); }
  .hint a { color: var(--wire); }

  main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 10px 2px 20px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--ink-faint);
    font-size: 13px;
    max-width: 340px;
    line-height: 1.6;
  }

  .msg { display: flex; flex-direction: column; max-width: 88%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-bottom-right-radius: 3px;
  }

  .msg.assistant .bubble { background: transparent; padding-left: 0; padding-right: 0; }

  .tool-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(94, 230, 168, 0.08);
    border: 1px solid var(--live-dim);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--live);
    margin: 4px 0;
  }

  .tool-chip .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }

  .thinking {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .thinking .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--wire);
    animation: blink 1.1s ease-in-out infinite;
  }

  @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  footer {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  footer input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 15px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
  }

  footer input::placeholder { color: var(--ink-faint); }
  footer input:focus { border-color: var(--wire); }
  footer input:focus-visible { outline: 2px solid var(--wire); outline-offset: 1px; }
  footer input:disabled { opacity: 0.5; }

  footer button {
    background: var(--wire);
    border: none;
    color: #06101f;
    border-radius: var(--radius);
    padding: 0 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  footer button:hover { background: #6da0f7; }
  footer button:disabled { opacity: 0.4; cursor: default; }
  footer button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  @media (max-width: 520px) {
    .field-row { flex-wrap: wrap; }
    .field-label { width: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>Wired <span>(free / Gemini)</span></h1>
    <div class="status" id="status"><div class="dot"></div><span id="status-text">Not connected</span></div>
  </div>

  <div class="field-row">
    <div class="field-label">Server</div>
    <input type="text" id="server-url" placeholder="Your Codespace URL, e.g. https://xxxx-3000.app.github.dev" autocomplete="off" />
  </div>
  <div class="field-row">
    <div class="field-label">Gemini key</div>
    <input type="password" id="api-key" placeholder="Paste your free Gemini API key (from aistudio.google.com/apikey)" autocomplete="off" />
  </div>
  <button class="connect-btn" id="connect-btn" type="button">Wire it up</button>
  <div class="hint" id="hint">Free API key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> — no credit card needed.</div>
</header>

<main id="chat">
  <div class="empty-state" id="empty-state">Fill in both fields above, click "Wire it up," then ask something like "what's the weather in Lisbon?"</div>
</main>

<footer>
  <input type="text" id="message-input" placeholder="Ask about the weather somewhere…" disabled />
  <button id="send-btn" type="button" disabled>Send</button>
</footer>

<script>
  const serverUrlInput = document.getElementById("server-url");
  const apiKeyInput = document.getElementById("api-key");
  const connectBtn = document.getElementById("connect-btn");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  const hint = document.getElementById("hint");
  const chat = document.getElementById("chat");
  const emptyState = document.getElementById("empty-state");
  const messageInput = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");

  const GEMINI_MODEL = "gemini-3.6-flash";

  let mcpServerUrl = null;
  let apiKey = null;
  let geminiTools = null; // functionDeclarations, built from the server's tools/list
  let history = []; // Gemini "contents" array

  function setHint(msg, isError) {
    hint.innerHTML = msg;
    hint.classList.toggle("error", !!isError);
  }

  function normalizeServerUrl(raw) {
    let url = raw.trim();
    if (!url) return null;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    url = url.replace(/\/+$/, "");
    if (!url.endsWith("/mcp")) url += "/mcp";
    return url;
  }

  // --- Minimal MCP client: talks JSON-RPC to your Streamable HTTP server ---

  let mcpRequestId = 1;

  async function mcpCall(method, params) {
    const res = await fetch(mcpServerUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json, text/event-stream",
      },
      body: JSON.stringify({
        jsonrpc: "2.0",
        id: mcpRequestId++,
        method,
        params: params || {},
      }),
    });

    const raw = await res.text();
    let payload;
    if (raw.trim().startsWith("event:")) {
      // Server responded with an SSE-style stream; pull the JSON out of it.
      const dataLine = raw.split("\n").find((line) => line.startsWith("data:"));
      payload = JSON.parse(dataLine.slice(5).trim());
    } else {
      payload = JSON.parse(raw);
    }

    if (payload.error) {
      throw new Error(payload.error.message || "MCP server returned an error.");
    }
    return payload.result;
  }

  // Convert an MCP tool's JSON Schema into Gemini's function declaration format
  // (Gemini uses uppercase type names and only a subset of JSON Schema).
  function toGeminiSchema(schema) {
    if (!schema || typeof schema !== "object") return { type: "STRING" };
    const typeMap = {
      string: "STRING",
      number: "NUMBER",
      integer: "INTEGER",
      boolean: "BOOLEAN",
      array: "ARRAY",
      object: "OBJECT",
    };
    const out = { type: typeMap[schema.type] || "STRING" };
    if (schema.description) out.description = schema.description;
    if (schema.enum) out.enum = schema.enum;
    if (schema.items) out.items = toGeminiSchema(schema.items);
    if (schema.properties) {
      out.properties = {};
      for (const [key, val] of Object.entries(schema.properties)) {
        out.properties[key] = toGeminiSchema(val);
      }
    }
    if (schema.required) out.required = schema.required;
    return out;
  }

  async function loadTools() {
    const result = await mcpCall("tools/list");
    geminiTools = [
      {
        functionDeclarations: result.tools.map((tool) => ({
          name: tool.name,
          description: tool.description || "",
          parameters: toGeminiSchema(tool.inputSchema),
        })),
      },
    ];
    return result.tools.map((t) => t.name);
  }

  connectBtn.addEventListener("click", async () => {
    const normalized = normalizeServerUrl(serverUrlInput.value);
    const key = apiKeyInput.value.trim();

    if (!normalized) return setHint("Paste your Codespace's forwarded URL first.", true);
    if (!key) return setHint("Paste your free Gemini API key first.", true);

    mcpServerUrl = normalized;
    apiKey = key;
    connectBtn.disabled = true;
    connectBtn.textContent = "Wiring…";
    setHint("Asking your server what tools it has…");

    try {
      const toolNames = await loadTools();
      statusEl.classList.add("live");
      statusText.textContent = "Wired — " + toolNames.length + " tools ready";
      setHint("Ready. Tools found: " + toolNames.join(", "));
      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.focus();
    } catch (err) {
      setHint("Couldn't reach your server: " + (err.message || "unknown error"), true);
    } finally {
      connectBtn.disabled = false;
      connectBtn.textContent = "Wire it up";
    }
  });

  function addUserBubble(text) {
    if (emptyState.parentNode) emptyState.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg user";
    wrap.innerHTML = `<div class="bubble"></div>`;
    wrap.querySelector(".bubble").textContent = text;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function addAssistantContainer() {
    const wrap = document.createElement("div");
    wrap.className = "msg assistant";
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  function addThinking(container, label) {
    const el = document.createElement("div");
    el.className = "thinking";
    el.innerHTML = `<div class="pulse"></div><span>${label}</span>`;
    container.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  function addToolChip(container, toolName) {
    const el = document.createElement("div");
    el.className = "tool-chip";
    el.innerHTML = `<div class="pulse"></div><span>ran ${toolName}</span>`;
    container.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTextBubble(container, text) {
    const el = document.createElement("div");
    el.className = "bubble";
    el.textContent = text;
    container.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  async function callGemini() {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey,
        },
        body: JSON.stringify({
          system_instruction: {
            parts: [
              {
                text:
                  "You are a friendly weather assistant. You have tools that wrap the Open-Meteo API. Use them to answer questions about weather, forecasts, and locations. Keep answers brief and conversational.",
              },
            ],
          },
          contents: history,
          tools: geminiTools,
        }),
      }
    );

    const data = await res.json();
    if (!res.ok) {
      const message = (data && data.error && data.error.message) || "Gemini request failed.";
      throw new Error(message);
    }
    return data;
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !mcpServerUrl || !apiKey) return;

    addUserBubble(text);
    history.push({ role: "user", parts: [{ text }] });
    messageInput.value = "";
    messageInput.disabled = true;
    sendBtn.disabled = true;

    const assistantContainer = addAssistantContainer();
    let thinkingEl = addThinking(assistantContainer, "thinking…");

    try {
      // Loop: Gemini may ask to call a tool, we run it, feed the result back,
      // and ask again — until it replies with plain text instead of a call.
      for (let round = 0; round < 5; round++) {
        const data = await callGemini();
        thinkingEl.remove();

        const candidate = data.candidates && data.candidates[0];
        const parts = (candidate && candidate.content && candidate.content.parts) || [];

        history.push({ role: "model", parts });

        const functionCalls = parts.filter((p) => p.functionCall);
        const textParts = parts.filter((p) => p.text);

        textParts.forEach((p) => addTextBubble(assistantContainer, p.text));

        if (functionCalls.length === 0) {
          break; // plain answer, we're done
        }

        // Run every requested tool call against the real MCP server.
        const functionResponses = [];
        for (const fc of functionCalls) {
          addToolChip(assistantContainer, fc.functionCall.name);
          try {
            const result = await mcpCall("tools/call", {
              name: fc.functionCall.name,
              arguments: fc.functionCall.args || {},
            });
            const resultText = (result.content || [])
              .filter((c) => c.type === "text")
              .map((c) => c.text)
              .join("\n");
            functionResponses.push({
              functionResponse: {
                name: fc.functionCall.name,
                response: { result: resultText },
              },
            });
          } catch (toolErr) {
            functionResponses.push({
              functionResponse: {
                name: fc.functionCall.name,
                response: { error: toolErr.message || "Tool call failed." },
              },
            });
          }
        }

        history.push({ role: "user", parts: functionResponses });
        thinkingEl = addThinking(assistantContainer, "reading the result…");
      }
    } catch (err) {
      if (thinkingEl.parentNode) thinkingEl.remove();
      addTextBubble(assistantContainer, "Something went wrong: " + (err.message || "unknown error"));
      setHint(err.message || "Something went wrong.", true);
    } finally {
      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  messageInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
  apiKeyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") connectBtn.click(); });
  serverUrlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") connectBtn.click(); });
</script>
</body>
</html>
